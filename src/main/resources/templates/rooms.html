<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Tìm phòng')}">
</head>
<body>
<header th:replace="~{fragments :: siteHeader}">
</header>
<main class="container page">
<div class="page-head">
<div>
<div class="eyebrow">KỲ NGHỈ CỦA BẠN</div>
<h1>Tìm không gian phù hợp</h1>
<p class="text-muted">Phòng còn trống trong toàn bộ khoảng ngày bạn chọn.</p>
</div>
</div>
<form th:replace="~{fragments :: search}">
</form>
<p class="mt-4 text-muted" th:text="${#lists.size(rooms)}+' phòng phù hợp'">
</p>
<div class="row g-4">
<div th:each="r:${rooms}" class="col-md-6 col-xl-4">
<article class="room-card">
<img th:src="@{'/images/room-'+${(r.roomType.id-1)%4+1}+'.jpg'}" th:alt="${r.roomType.name}" data-fallback="/images/fallback.svg">
<div class="card-body">
<div class="eyebrow mb-2" th:text="'PHÒNG '+${r.number}+' · TẦNG '+${r.floor}">
</div>
<h3 th:text="${r.roomType.name}">
</h3>
<p class="text-muted" th:text="'Tối đa '+${r.roomType.capacity}+' khách'">
</p>
<div class="mb-3">
<span class="tag" th:each="a:${r.roomType.amenities}" th:if="${a.active}" th:text="${a.name}">
</span>
</div>
<p class="price">
<span th:text="${@money.format(r.roomType.price)}">
</span> ₫ <small>/ đêm</small>
</p>
<a class="btn btn-primary w-100" th:href="@{/rooms/{id}(id=${r.id},checkIn=${search.checkIn},checkOut=${search.checkOut},guests=${search.guests})}">Xem chi tiết ↗</a>
</div>
</article>
</div>
</div>
<div class="empty panel" th:if="${#lists.isEmpty(rooms)}">
<h3>Chưa tìm thấy phòng phù hợp</h3>
<p>Kiểm tra thông tin hoặc thử khoảng ngày và số khách khác.</p>
</div>
<div th:replace="~{fragments :: policy}">
</div>
</main>
<footer th:replace="~{fragments :: footer}">
</footer>
</body>
</html>
