<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Đăng ký')}">
</head>
<body>
<header th:replace="~{fragments :: siteHeader}">
</header>
<main class="container page">
<div class="auth-shell panel">
<div class="eyebrow">BẮT ĐẦU KỲ NGHỈ</div>
<h1>Tạo tài khoản</h1>
<p class="text-muted">Đặt phòng, theo dõi yêu cầu và lưu giữ những kỳ nghỉ.</p>
<form th:action="@{/register}" th:object="${form}" method="post">
<div th:replace="~{fragments :: errors}">
</div>
<label class="form-label" for="fullName">Họ và tên</label>
<input class="form-control" th:field="*{fullName}" maxlength="100" autocomplete="name" required>
<small class="field-error" th:errors="*{fullName}">
</small>
<label class="form-label" for="email">Email</label>
<input class="form-control" type="email" th:field="*{email}" maxlength="190" autocomplete="email" required>
<small class="field-error" th:errors="*{email}">
</small>
<label class="form-label" for="phone">Số điện thoại</label>
<input class="form-control" type="tel" th:field="*{phone}" maxlength="20" autocomplete="tel" required>
<small class="field-error" th:errors="*{phone}">
</small>
<label class="form-label" for="password">Mật khẩu</label>
<input id="password" name="password" class="form-control" type="password" minlength="10" maxlength="60" autocomplete="new-password" required>
<small class="text-muted">Từ 10 đến 60 ký tự.</small>
<small class="field-error" th:errors="*{password}">
</small>
<button class="btn btn-primary w-100 mt-4">Tạo tài khoản khách hàng</button>
</form>
<p class="small text-center mt-4 mb-0">Đã có tài khoản? <a th:href="@{/login}">Đăng nhập</a>
</p>
</div>
</main>
<footer th:replace="~{fragments :: footer}">
</footer>
</body>
</html>
