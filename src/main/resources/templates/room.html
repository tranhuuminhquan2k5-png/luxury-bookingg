<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Chi tiết phòng')}">
</head>
<body>
<header th:replace="~{fragments :: siteHeader}">
</header>
<main class="container page">
<a th:href="@{/rooms(checkIn=${search.checkIn},checkOut=${search.checkOut},guests=${search.guests})}" class="small">← Kết quả tìm phòng</a>
<div class="page-head mt-3">
<div>
<div class="eyebrow" th:text="'PHÒNG '+${room.number}+' · TẦNG '+${room.floor}">
</div>
<h1 th:text="${room.roomType.name}">
</h1>
</div>
<span class="tag" th:text="'Tối đa '+${room.roomType.capacity}+' khách'">
</span>
</div>
<img class="room-hero mb-4" th:src="@{'/images/room-'+${(room.roomType.id-1)%4+1}+'.jpg'}" th:alt="${room.roomType.name}" data-fallback="/images/fallback.svg">
<div class="row g-4">
<div class="col-lg-7">
<div class="panel">
<h2>Thư thái trong từng chi tiết</h2>
<p class="mt-3" th:text="${room.roomType.description}">
</p>
<h3 class="h4 mt-4">Tiện nghi phòng</h3>
<span class="tag" th:each="a:${room.roomType.amenities}" th:if="${a.active}" th:text="${a.name}">
</span>
</div>
<div th:replace="~{fragments :: policy}">
</div>
</div>
<div class="col-lg-5">
<form class="panel" method="get" th:action="@{/bookings/new}">
<h3>Đặt kỳ nghỉ của bạn</h3>
<p class="price">
<span th:text="${@money.format(room.roomType.price)}">
</span> ₫ <small>/ đêm</small>
</p>
<input type="hidden" name="roomId" th:value="${room.id}">
<label class="form-label" for="in">Ngày nhận</label>
<input id="in" class="form-control mb-3" type="date" name="checkIn" th:value="${search.checkIn}" th:min="${today}" required>
<label class="form-label" for="out">Ngày trả</label>
<input id="out" class="form-control mb-3" type="date" name="checkOut" th:value="${search.checkOut}" required>
<label class="form-label" for="guests">Số khách</label>
<input id="guests" class="form-control mb-3" type="number" min="1" th:max="${room.roomType.capacity}" name="guests" th:value="${search.guests}" required>
<button class="btn btn-primary w-100" th:disabled="${!room.status.bookable() or !room.roomType.active}">Tiếp tục đặt phòng ↗</button>
<small class="text-muted d-block mt-3">Lịch và giá được kiểm tra lại khi gửi yêu cầu.</small>
</form>
</div>
</div>
</main>
<footer th:replace="~{fragments :: footer}">
</footer>
</body>
</html>
