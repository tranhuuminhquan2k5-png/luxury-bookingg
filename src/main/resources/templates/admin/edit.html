<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Cập nhật danh mục')}">
</head>
<body>
<header th:replace="~{fragments :: siteHeader}">
</header>
<nav th:replace="~{fragments :: staffnav}">
</nav>
<main class="container page">
<div class="page-head">
<div>
<div class="eyebrow">QUẢN TRỊ DANH MỤC</div>
<h1 th:text="${form.id==null}?'Thêm mới':'Chỉnh sửa thông tin'">
</h1>
</div>
<a th:href="@{/admin/catalog/{kind}(kind=${kind})}">← Danh sách</a>
</div>
<form class="panel mx-auto" style="max-width:800px" th:action="@{/admin/catalog/{kind}(kind=${kind})}" th:object="${form}" method="post" data-confirm="Lưu thay đổi danh mục này?">
<div th:replace="~{fragments :: errors}">
</div>
<input type="hidden" th:field="*{id}">
<th:block th:if="${kind!='rooms'}">
<label class="form-label" for="name">Tên</label>
<input class="form-control mb-1" th:field="*{name}" maxlength="100" required>
<small class="field-error" th:errors="*{name}">
</small>
</th:block>
<th:block th:if="${kind=='types'}">
<label class="form-label mt-3" for="description">Mô tả</label>
<textarea th:field="*{description}" class="form-control" maxlength="2000" rows="4" required>
</textarea>
<small class="field-error" th:errors="*{description}">
</small>
<label class="form-label mt-3" for="capacity">Sức chứa tối đa</label>
<input type="number" min="1" max="100" th:field="*{capacity}" class="form-control" required>
<small class="field-error" th:errors="*{capacity}">
</small>
<label class="form-label mt-3" for="amenityIds">Tiện nghi (giữ Ctrl để chọn nhiều)</label>
<select class="form-select" th:field="*{amenityIds}" multiple size="6">
<option th:each="a:${amenities}" th:value="${a.id}" th:text="${a.name}+(${a.active}?'':' (ngừng hoạt động)')">
</option>
</select>
</th:block>
<th:block th:if="${kind=='types' or kind=='services'}">
<label class="form-label mt-3" for="price" th:text="${kind=='types'?'Giá mỗi đêm (VND)':'Đơn giá dịch vụ (VND)'}">
</label>
<input type="number" min="1" max="999999999999" step="0.01" th:field="*{price}" class="form-control" required>
<small class="field-error" th:errors="*{price}">
</small>
<small class="text-muted">Giá mới không thay đổi giá đã lưu trong đơn hoặc dịch vụ cũ.</small>
</th:block>
<th:block th:if="${kind=='services'}">
<label class="form-label mt-3" for="unit">Đơn vị tính</label>
<input class="form-control" th:field="*{unit}" maxlength="40" required>
<small class="field-error" th:errors="*{unit}">
</small>
</th:block>
<th:block th:if="${kind=='rooms'}">
<label class="form-label" for="number">Số phòng</label>
<input class="form-control" th:field="*{number}" maxlength="20" required>
<small class="field-error" th:errors="*{number}">
</small>
<label class="form-label mt-3" for="floor">Tầng</label>
<input type="number" min="-5" max="200" class="form-control" th:field="*{floor}" required>
<small class="field-error" th:errors="*{floor}">
</small>
<label class="form-label mt-3" for="typeId">Loại phòng</label>
<select class="form-select" th:field="*{typeId}" required>
<option value="">Chọn loại phòng</option>
<option th:each="t:${types}" th:value="${t.id}" th:text="${t.name}+(${t.active}?'':' (ngừng hoạt động)')">
</option>
</select>
<small class="field-error" th:errors="*{typeId}">
</small>
<label class="form-label mt-3" for="status">Trạng thái vận hành</label>
<select class="form-select" th:field="*{status}">
<option th:each="s:${roomStatuses}" th:value="${s}" th:text="${s.label}">
</option>
</select>
<small class="text-muted">Có khách chỉ được tạo bằng nhận phòng. Bảo trì/ngừng kinh doanh yêu cầu xử lý hết các đơn giữ lịch trước.</small>
</th:block>
<div th:if="${kind!='rooms'}" class="form-check mt-4">
<input class="form-check-input" type="checkbox" th:field="*{active}">
<label class="form-check-label" for="active">Đang hoạt động</label>
</div>
<div class="d-flex gap-3 mt-4">
<button class="btn btn-primary">Lưu thông tin</button>
<a class="btn btn-outline-primary" th:href="@{/admin/catalog/{kind}(kind=${kind})}">Quay lại</a>
</div>
</form>
</main>
<footer th:replace="~{fragments :: footer}">
</footer>
</body>
</html>
