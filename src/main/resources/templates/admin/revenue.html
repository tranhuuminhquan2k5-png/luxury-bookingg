<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Doanh thu')}">
</head>
<body>
<header th:replace="~{fragments :: siteHeader}">
</header>
<nav th:replace="~{fragments :: staffnav}">
</nav>
<main class="container page">
<div class="page-head">
<div>
<div class="eyebrow">QUẢN TRỊ · TÀI CHÍNH</div>
<h1>Doanh thu &amp; thanh toán</h1>
<p class="text-muted">Chỉ tính khoản thanh toán thành công theo ngày thanh toán. Đơn demo được xem riêng.</p>
</div>
</div>
<form th:action="@{/admin/revenue}" method="get" class="panel row g-3 mx-0">
<div class="col-md-3">
<label class="form-label" for="from">Từ ngày</label>
<input class="form-control" type="date" id="from" name="from" th:value="${from}" required>
</div>
<div class="col-md-3">
<label class="form-label" for="to">Đến ngày</label>
<input class="form-control" type="date" id="to" name="to" th:value="${to}" required>
</div>
<div class="col-md-4">
<label class="form-label" for="demo">Nguồn dữ liệu</label>
<select class="form-select" id="demo" name="demo">
<option value="false" th:selected="${!demo}">Đơn thông thường</option>
<option value="true" th:selected="${demo}">Chỉ đơn demo</option>
</select>
</div>
<div class="col-md-2 d-flex align-items-end">
<button class="btn btn-primary w-100">Xem thống kê</button>
</div>
</form>
<div class="row g-3 mb-4">
<div class="col-md-8">
<div class="stat">
<span th:text="${demo}?'Doanh thu mô phỏng từ đơn demo':'Tổng khoản thu thành công'">
</span>
<strong class="value" th:text="${@money.format(total)}+' ₫'">
</strong>
</div>
</div>
<div class="col-md-4">
<div class="stat">
<span>Số hóa đơn đã thanh toán</span>
<strong class="value" th:text="${payments.totalElements}">
</strong>
</div>
</div>
</div>
<div class="table-panel table-responsive">
<table class="table">
<thead>
<tr>
<th>Ngày thanh toán</th>
<th>Khách hàng</th>
<th>Hóa đơn</th>
<th>Số tiền</th>
</tr>
</thead>
<tbody>
<tr th:each="p:${payments.content}">
<td th:text="${#temporals.format(p.paidAt,'dd/MM/yyyy HH:mm')}">
</td>
<td th:text="${p.invoice.customerName}">
</td>
<td>
<a class="booking-code" th:href="@{/bookings/{id}/invoice(id=${p.invoice.booking.id})}" th:text="${p.invoice.code}">
</a>
</td>
<td th:text="${@money.format(p.amount)}+' ₫'">
</td>
</tr>
</tbody>
</table>
<div class="empty" th:if="${payments.empty}">
<h3>Chưa có khoản thu trong khoảng này</h3>
<p>Thử thay đổi ngày hoặc nguồn dữ liệu.</p>
</div>
</div>
<div class="pagination-bar">
<a th:if="${payments.hasPrevious()}" th:href="@{/admin/revenue(from=${from},to=${to},demo=${demo},page=${payments.number-1})}">← Trước</a>
<span th:text="'Trang '+${payments.number+1}+' / '+${T(java.lang.Math).max(1,payments.totalPages)}">
</span>
<a th:if="${payments.hasNext()}" th:href="@{/admin/revenue(from=${from},to=${to},demo=${demo},page=${payments.number+1})}">Sau →</a>
</div>
</main>
<footer th:replace="~{fragments :: footer}">
</footer>
</body>
</html>
