spring.application.name=luxury-hotel
server.address=127.0.0.1
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mariadb://127.0.0.1:3306/luxury_hotel}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.community.dialect.MariaDBLegacyDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.thymeleaf.cache=true
spring.mvc.format.date=iso
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
hotel.zone=Asia/Ho_Chi_Minh
hotel.check-in-time=14:00
hotel.check-out-time=12:00
hotel.no-show-time=23:59
hotel.demo.allow-early-check-in=false
debug=false
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=WARN
